<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algorithms แบบเห็นภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@1,400;1,600&display=swap">
<style>
:root{
  /* แผนผัง: รางบทเรียนซ้าย + โต๊ะทดลอง (กราฟ/โค้ด/ตาราง) · สีอิงแม่แบบสไลด์ของอาจารย์ slate + teal · vertex ใช้ขาว/เทา/ดำตาม CLRS */
  --ink:#20262e;--muted:#55616c;--paper:#f3f5f4;--panel:#fff;--line:#d3dbd9;
  --accent:#1a6f73;--hot:#c4500a;--pink:#a1357e;--ok:#2a7648;--bad:#b0302a;
  --band:#dfecea;--slate:#3d4156;--on-slate:#f2f4f5;
  --v-w:#fff;--v-wt:#20262e;--v-g:#c6ced2;--v-gt:#20262e;--v-b:#20262e;--v-bt:#fff;--v-s:#20262e;
  --c0:#b4e0da;--c1:#f7d3a6;--c2:#e6c0df;--c3:#c3d5f4;--c4:#d8e4a8;--c5:#f3c2ba;--c-t:#14181d;
  --f-d:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-b:'IBM Plex Sans Thai','Noto Sans Thai',Tahoma,system-ui,sans-serif;
  --f-m:'IBM Plex Mono','IBM Plex Sans Thai',ui-monospace,Menlo,Consolas,monospace;
  --f-s:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--ink:#e6ebee;--muted:#a6b1ba;--paper:#13171c;--panel:#1b2128;--line:#333d47;
  --accent:#5cbcbc;--hot:#f4974f;--pink:#e583c9;--ok:#71c892;--bad:#f0857b;--band:#21393c;--slate:#2a2e40;
  --v-w:#eef2f3;--v-wt:#14181d;--v-g:#8d99a3;--v-gt:#14181d;--v-b:#0a0d10;--v-bt:#fff;--v-s:#e6ebee;
}}
:root[data-theme="dark"]{
  color-scheme:dark;--ink:#e6ebee;--muted:#a6b1ba;--paper:#13171c;--panel:#1b2128;--line:#333d47;
  --accent:#5cbcbc;--hot:#f4974f;--pink:#e583c9;--ok:#71c892;--bad:#f0857b;--band:#21393c;--slate:#2a2e40;
  --v-w:#eef2f3;--v-wt:#14181d;--v-g:#8d99a3;--v-gt:#14181d;--v-b:#0a0d10;--v-bt:#fff;--v-s:#e6ebee;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.75 var(--f-b);overflow-wrap:anywhere}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-d);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
code,.mono{font-family:var(--f-m);font-size:.92em}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.m,.vx{font-family:var(--f-s);font-style:italic}
.m sub,.m sup{font-size:.72em}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--slate);color:var(--on-slate);padding:18px 12px 28px;position:sticky;top:0;height:100vh;overflow:auto;border-bottom:0}
.rail::before{content:"";display:block;height:4px;background:var(--accent);margin:-18px -12px 16px}
.brand{font:600 17px/1.3 var(--f-d);color:inherit;text-decoration:none;display:block;padding:0 8px 12px}
.chap{font:500 12px/1.4 var(--f-b);opacity:.72;padding:12px 8px 4px}
.navb{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:15px/1.4 var(--f-b);padding:6px 8px;border-radius:4px;cursor:pointer}
.navb:hover{background:rgba(255,255,255,.09)}
.navb[aria-current="page"]{background:var(--on-slate);color:#20262e;font-weight:600}
.wrap{padding:24px clamp(16px,3vw,36px) 64px;max-width:1240px;width:100%}

.crumb{font-size:13px;color:var(--muted)}
.lh h1{font-size:clamp(24px,3vw,32px);margin:2px 0 6px}
.lead{max-width:68ch;color:var(--ink)}

.bench{display:grid;gap:14px 18px;margin-top:16px;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);grid-template-areas:"stage code" "stage panels";grid-template-rows:auto 1fr;align-items:start}
.bench.wide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"stage panels" "stage code";grid-template-rows:auto 1fr}
.bench.nocode{grid-template-areas:"stage panels";grid-template-rows:auto}
.stage{grid-area:stage;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.codebox{grid-area:code;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 0}
.panels{grid-area:panels;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.panel h3,.pt{font:500 13px/1.4 var(--f-b);color:var(--muted);margin:0 0 6px}

.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pre{font:14px/1.3 var(--f-b);padding:5px 10px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:4px;cursor:pointer}
.pre:hover{border-color:var(--accent)}
.pre[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
#gsvg{display:block;width:100%;height:auto;max-height:430px}

.narr{min-height:76px;border-left:4px solid var(--hot);background:var(--paper);padding:8px 12px;margin-top:8px;font-size:15.5px;line-height:1.65}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px}
.btn{font:14px/1.2 var(--f-b);padding:7px 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:600;min-width:72px}
#rng{flex:1 1 90px;min-width:80px;accent-color:var(--accent)}
.count{font:13px/1 var(--f-m);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
select{font:14px var(--f-b);padding:6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.chk{font-size:14px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:50%;border:1.4px solid var(--v-s);display:inline-block}
.sl{width:20px;height:0;border-top:3px solid currentColor;display:inline-block}

/* กราฟ */
.n rect{stroke:var(--v-s);stroke-width:1.5;transition:fill .22s,stroke .22s,stroke-width .22s}
.n text{font:600 14px var(--f-m);text-anchor:middle;dominant-baseline:central;transition:fill .22s}
.n .out{font:italic 15px var(--f-s);fill:var(--ink)}
.n.nameIn .in{font:italic 600 15px var(--f-s)}
.n.nameIn .out{font:13px var(--f-m);fill:var(--muted)}
.n.white rect{fill:var(--v-w)}.n.white .in{fill:var(--v-wt)}
.n.gray rect{fill:var(--v-g)}.n.gray .in{fill:var(--v-gt)}
.n.black rect{fill:var(--v-b)}.n.black .in{fill:var(--v-bt)}
.n.c0 rect{fill:var(--c0)}.n.c1 rect{fill:var(--c1)}.n.c2 rect{fill:var(--c2)}.n.c3 rect{fill:var(--c3)}.n.c4 rect{fill:var(--c4)}.n.c5 rect{fill:var(--c5)}
.n.c0 .in,.n.c1 .in,.n.c2 .in,.n.c3 .in,.n.c4 .in,.n.c5 .in{fill:var(--c-t)}
.n.cur rect{stroke:var(--hot);stroke-width:4}
.n.k rect{stroke:var(--pink);stroke-width:3.5}
.n.via rect{stroke:var(--accent);stroke-width:5}
.e path{fill:none;stroke:var(--muted);stroke-width:1.4;transition:stroke .22s,stroke-width .22s,opacity .22s}
.e .w{font:13px var(--f-m);fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.e .cl{font:700 13px var(--f-m);fill:var(--pink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.e.act path{stroke:var(--hot);stroke-width:4}
.e.peek path{stroke:var(--pink);stroke-width:3}
.e.tree path{stroke:var(--accent);stroke-width:4}
.e.cand path{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 5}
.e.rej path{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:3 4;opacity:.75}
.e.back path{stroke:var(--pink);stroke-width:2}
.e.nt path{stroke:var(--muted);stroke-width:2}
.e.pa path{stroke:var(--pink);stroke-width:4.5}
.e.pb path{stroke:var(--hot);stroke-width:4.5}
.mk-base{fill:var(--muted)}.mk-act,.mk-pb{fill:var(--hot)}.mk-peek,.mk-back,.mk-pa{fill:var(--pink)}.mk-tree,.mk-cand{fill:var(--accent)}.mk-rej{fill:var(--bad)}.mk-nt{fill:var(--muted)}

/* โค้ด */
.proc{font:500 13px/1.4 var(--f-m);padding:4px 12px;color:var(--accent)}
.ln{display:grid;grid-template-columns:30px 1fr;font:13px/1.55 var(--f-m);padding:1px 12px 1px 6px;border-left:3px solid transparent}
.ln sup,.ln sub{font-size:.74em;line-height:0}
.ln .no{color:var(--muted);text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
.ln.on{background:var(--band);border-left-color:var(--hot);font-weight:500}

/* แผง */
.q{display:flex;flex-wrap:wrap;gap:3px;min-height:44px}
.q .cell{border:1.3px solid var(--ink);min-width:34px;text-align:center;padding:1px 6px;font:italic 15px/1.35 var(--f-s);background:var(--band)}
.q .cell small{display:block;font:12px/1.2 var(--f-m);color:var(--muted)}
.empty{font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:13.5px/1.35 var(--f-m);padding:2px 7px;border:1px solid var(--line);border-radius:3px;display:inline-flex;gap:4px;align-items:baseline}
.chip small{font-size:11px;color:var(--muted)}
.chip.now{background:var(--hot);border-color:var(--hot);color:var(--panel);font-weight:600}
.chip.done{opacity:.55}
.chip.c0{background:var(--c0);color:var(--c-t)}.chip.c1{background:var(--c1);color:var(--c-t)}.chip.c2{background:var(--c2);color:var(--c-t)}.chip.c3{background:var(--c3);color:var(--c-t)}.chip.c4{background:var(--c4);color:var(--c-t)}.chip.c5{background:var(--c5);color:var(--c-t)}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font:13px/1.45 var(--f-m);font-variant-numeric:tabular-nums}
table.t th{color:var(--muted);font-weight:500;text-align:left;border-bottom:1px solid var(--line);padding:2px 6px}
table.t td{padding:2px 6px;border-bottom:1px solid var(--line)}
table.t td:first-child{white-space:nowrap}
table.t tr.hi td{background:var(--band);font-weight:600}
table.mx{border-collapse:collapse;font:13px/1.4 var(--f-m);font-variant-numeric:tabular-nums;margin:0 auto}
table.mx th{color:var(--muted);font-weight:400;padding:1px 5px}
table.mx td{border:1px solid var(--line);text-align:center;min-width:32px;padding:2px 3px}
table.mx.small td{font-size:12px;min-width:30px}
table.mx td.band{background:var(--band)}
table.mx td.src{background:var(--pink);color:var(--panel);font-weight:600}
table.mx td.tgt{background:var(--hot);color:var(--panel);font-weight:600}
table.mx td.click{cursor:pointer}
table.mx td.click:hover{outline:2px solid var(--accent);outline-offset:-2px}
.alist{font:13.5px/1.7 var(--f-m)}
.alist div{padding:0 4px}
.alist .hi{background:var(--band);font-weight:600}
.alist b{font-weight:600;color:var(--accent);display:inline-block;width:1.6em}
.parent{font:12.5px/1.5 var(--f-m);color:var(--muted);margin-top:6px}
.pbar rect{fill:var(--v-g);stroke:var(--v-s);stroke-width:.8}
.pbar rect.open{fill:var(--band);stroke-dasharray:3 2}
.pbar text{font:italic 12px var(--f-s);fill:var(--v-gt);text-anchor:middle;dominant-baseline:central}
.pbar rect.open+text{fill:var(--ink)}
.pbar .tick{font:10px var(--f-m);fill:var(--muted);font-style:normal}
.lin rect{fill:var(--v-g);stroke:var(--v-s)}
.lin text{font:12px var(--f-m);fill:var(--v-gt);text-anchor:middle;dominant-baseline:central}
.lin path{fill:none;stroke:var(--accent);stroke-width:1.4}
.pathbox{grid-column:1/-1;border-left:4px solid var(--accent);padding:6px 12px;background:var(--panel);font-size:14.5px}

/* เนื้อหา */
.notes{margin-top:30px;display:grid;gap:24px;max-width:74ch}
.notes h2{font-size:20px;margin-bottom:6px}
.notes p+p{margin-top:8px}
.eq{text-align:center;padding:6px 0;font-size:17px}
table.cmp{border-collapse:collapse;width:100%;font-size:15px;margin:4px 0}
table.cmp th{text-align:left;font-weight:600;border-bottom:2px solid var(--ink);padding:4px 10px 4px 0}
table.cmp td{border-bottom:1px solid var(--line);padding:5px 10px 5px 0;vertical-align:top}
details.rt{border:1px solid var(--accent);border-radius:6px;background:var(--panel);padding:0 14px}
details.rt summary{cursor:pointer;font:600 16px/1.4 var(--f-d);padding:10px 0;color:var(--accent)}
details.rt[open]{padding-bottom:12px}
.big{font:600 19px/1.4 var(--f-m);margin-bottom:4px}
ul.pit{margin:0;padding:0 0 0 20px}
ul.pit li{margin:4px 0}
.quiz{display:grid;gap:18px}
.qq{font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{font:15px/1.4 var(--f-b);text-align:left;padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok);border-color:var(--ok);color:var(--panel);font-weight:600}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.why{margin-top:6px;font-size:15px;color:var(--muted)}
.med{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.med span{display:block;font-size:14.5px;color:var(--muted);line-height:1.5}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}

details.cust{margin-top:10px;font-size:14.5px}
details.cust summary{cursor:pointer;color:var(--accent);font-weight:500}
.cform{display:grid;gap:6px;margin-top:6px}
.cform textarea{width:100%;min-height:100px;font:14px/1.5 var(--f-m);padding:6px 8px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;resize:vertical}
.cform input{font:14px var(--f-m);padding:5px 8px;width:90px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.cform .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;min-height:1em}

/* หน้าแรก */
.home h1{font-size:clamp(28px,4vw,40px);margin-bottom:8px}
.home section{margin-top:28px}
.home h2{font-size:21px;margin-bottom:8px}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto}
#map{display:block;min-width:760px;width:100%;height:auto}
#map .node{cursor:pointer}
#map .node rect{fill:var(--paper);stroke:var(--accent);stroke-width:1.4}
#map .node:hover rect,#map .node:focus-visible rect{fill:var(--band);stroke-width:2.4}
#map .node text{font:500 14px var(--f-b);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
#map .hd{font:500 13px var(--f-b);fill:var(--muted);text-anchor:middle}
#map path{fill:none;stroke:var(--muted);stroke-width:1.2}
#map .lb{font:12px var(--f-b);fill:var(--pink);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4px}
#map .ah{fill:var(--muted)}
table.ov{border-collapse:collapse;width:100%;font-size:15px}
table.ov th{text-align:left;font-weight:600;border-bottom:2px solid var(--ink);padding:5px 10px 5px 0;white-space:nowrap}
table.ov td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top}
table.ov td.mono{white-space:nowrap}
.linkb{background:none;border:0;padding:0;color:var(--accent);font:600 15px var(--f-b);text-decoration:underline;cursor:pointer;text-align:left}


/* สารบัญแบบแบ่งวิชา */
details.grp{margin-top:6px}
details.grp>summary{cursor:pointer;font:500 14px/1.35 var(--f-b);padding:6px 8px;border-radius:4px;list-style-position:outside;margin-left:12px}
details.grp>summary:hover{background:rgba(255,255,255,.09)}
details.grp .no{font:500 12px var(--f-m);opacity:.7;margin-right:6px}
details.grp[open]>summary{font-weight:600}
details.grp .navb{padding-left:18px;font-size:14px}
details.grp .chap{padding-left:18px}
.navsel{display:none}
.subs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.subc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.subc h3{font-size:17px;margin:2px 0 8px}
.subl{display:flex;flex-wrap:wrap;gap:4px 12px}
.linkb.sm{font-size:14.5px;font-weight:500}
ul.xl{margin:0;padding-left:20px;font-size:15.5px}
ul.xl li{margin:5px 0}
table.ov tr.gh th{background:var(--band);padding:6px 10px;border-bottom:0;font-family:var(--f-d)}
.sn{border-left:4px solid var(--pink);padding-left:14px}
.sw.sq2{border-radius:2px;border:1px solid var(--line)}

/* มุมมองที่ไม่ใช่กราฟ */
.vis{min-height:220px}
.vis .panel{border:0;padding:0}
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.fullw{grid-column:1/-1}
.pt{font:500 13px/1.4 var(--f-b);color:var(--muted);margin:0 0 4px}
.arr{display:flex;flex-wrap:wrap;gap:3px}
.ac{min-width:36px;flex:0 0 auto;text-align:center;border:1.2px solid var(--v-s);display:flex;flex-direction:column;line-height:1.25;background:var(--panel)}
.ac small{font:10.5px var(--f-m);color:var(--muted)}
.ac b{font:600 15px var(--f-m);padding:0 4px}
.ac em{font:600 11px var(--f-m);color:var(--hot);font-style:normal;min-height:14px}
.ac.tgt{background:var(--hot)}.ac.tgt b,.ac.tgt small{color:var(--panel)}
.ac.src{background:var(--pink)}.ac.src b,.ac.src small{color:var(--panel)}
.ac.band{background:var(--band)}
.ac.lo{background:var(--c0)}.ac.hi{background:var(--c1)}.ac.piv{background:var(--c2)}
.ac.lo b,.ac.hi b,.ac.piv b,.ac.lo small,.ac.hi small,.ac.piv small{color:var(--c-t)}
.ac.out{opacity:.38}
.stack{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two.wide2{grid-template-columns:minmax(150px,210px) minmax(0,1fr);align-items:start}
.lanes{display:grid;gap:12px}
.lane{display:grid;grid-template-columns:repeat(var(--n),minmax(24px,1fr));gap:5px}
.seg{display:flex;border:1.3px solid var(--v-s);background:var(--panel)}
.seg b{flex:1;text-align:center;font:600 14px/1.9 var(--f-m);border-right:1px solid var(--line)}
.seg b:last-child{border-right:0}
.seg.done{background:var(--band)}
.seg.cur{outline:3px solid var(--hot);outline-offset:1px}
.seg b.pv{background:var(--c2);color:var(--c-t)}

<body><div class="app"><nav class="rail" id="rail" aria-label="สารบัญบทเรียน"></nav><main class="wrap" id="main"></main></div>
<script>
/* ===== อัลกอริทึมทั้งหมด: รันจริงแล้วบันทึกทีละขั้น ไม่แตะ DOM ===== */
const INF = Infinity;
const fmt = x => x === INF ? '∞' : x === -INF ? '−∞' : x < 0 ? '−' + (-x) : '' + x;
const V = s => `<i class="vx">${s}</i>`;
const thC = c => c === 'white' ? 'ขาว' : c === 'gray' ? 'เทา' : 'ดำ';
const cmpId = (a, b) => (+a === +a && +b === +b) ? (+a - +b) : (a < b ? -1 : a > b ? 1 : 0);

function makeGraph(d) {
  const G = {
    ids: d.nodes.map(n => n[0]), pos: {}, la: {}, E: [], adj: {},
    directed: !!d.directed, weighted: !!d.weighted, W: d.W || 600, H: d.H || 360,
    nameIn: !!d.nameIn, labels: d.labels || {},
  };
  d.nodes.forEach(n => { G.pos[n[0]] = [n[1], n[2]]; G.la[n[0]] = n[3] || ''; });
  G.ids.forEach(v => G.adj[v] = []);
  d.edges.forEach(e => {
    const o = { u: e[0], v: e[1], w: G.weighted ? e[2] : 1, opt: (G.weighted ? e[3] : e[2]) || {} };
    G.E.push(o);
    G.adj[o.u].push({ v: o.v, w: o.w });
    if (!G.directed && o.u !== o.v) G.adj[o.v].push({ v: o.u, w: o.w });
  });
  if (d.adj) for (const u in d.adj) G.adj[u] = d.adj[u].map(v => {
    const a = G.adj[u].find(x => x.v === v);
    if (!a) throw new Error('adj order mentions a non-edge ' + u + '-' + v);
    return a;
  });
  G.order = d.order || G.ids.slice();
  G.edgeOrder = d.edgeOrder ? d.edgeOrder.map(p => G.E.find(e => e.u === p[0] && e.v === p[1])) : G.E.slice();
  return G;
}
const ek = (G, u, v) => G.directed ? u + '>' + v : (u < v ? u + '>' + v : v + '>' + u);

class Rec {
  constructor(G) {
    this.G = G; this.steps = []; this.n = {}; this.e = {}; this.el = {};
    this.hiN = {}; this.tmpE = {}; this.flip = false; this.result = {};
    G.ids.forEach(v => this.n[v] = { c: 'white', t: '' });
  }
  hi(id, cls = 'cur') { this.hiN[id] = cls; return this; }
  act(key, cls = 'act') { this.tmpE[key] = cls; return this; }
  snap(line, msg, panels = [], extra = {}) {
    const n = {};
    this.G.ids.forEach(v => n[v] = { ...this.n[v], h: this.hiN[v] || '' });
    this.steps.push({ line, msg, n, e: { ...this.e, ...this.tmpE }, el: { ...this.el }, panels, flip: this.flip, ...extra });
    this.hiN = {}; this.tmpE = {};
  }
  out() { return { steps: this.steps, result: this.result }; }
}

const tbl = (title, head, rows, hi = -1) => ({ type: 'table', title, head, rows, hi });
const chips = (title, items, note) => ({ type: 'chips', title, items, note });
const queue = (title, items, empty) => ({ type: 'queue', title, items, empty });
const mat = (title, ids, M, cells = {}, opt = {}) => ({ type: 'matrix', title, ids, M, cells, ...opt });

function setPiEdges(R, G, pi) {
  for (const k in R.e) if (R.e[k] === 'tree') delete R.e[k];
  G.ids.forEach(v => { if (pi[v]) R.e[ek(G, pi[v], v)] = 'tree'; });
}

/* ---------- การแทนกราฟ ---------- */
function runRep(G) {
  const R = new Rec(G);
  const n = G.ids.length;
  const has = (i, j) => G.adj[G.ids[i]].some(a => a.v === G.ids[j]);
  const M = G.ids.map((_, i) => G.ids.map((_, j) => has(i, j) ? '1' : '0'));
  const total = G.ids.reduce((s, v) => s + G.adj[v].length, 0);
  const P = u => {
    const rows = G.ids.map(v => ({ v, list: G.adj[v].map(a => a.v), hi: v === u }));
    const cells = {};
    if (u) { const i = G.ids.indexOf(u); G.ids.forEach((_, j) => cells[i + ',' + j] = M[i][j] === '1' ? 'tgt' : 'band'); }
    return [{ type: 'adjlist', title: 'Adjacency list', rows }, mat('Adjacency matrix', G.ids, M, cells)];
  };
  const m = G.E.length;
  R.snap(0, `กราฟนี้มี |V| = ${n}, |E| = ${m} ทั้งสองแบบเก็บข้อมูลชุดเดียวกัน ความต่างอยู่ที่พื้นที่และความเร็วในการถาม`, P(null));
  G.ids.forEach(u => {
    const nb = G.adj[u].map(a => a.v);
    nb.forEach(v => R.act(ek(G, u, v)));
    R.hi(u);
    R.snap(0, nb.length ? `Adj[${V(u)}] = ${nb.map(V).join(', ')} ในเมทริกซ์คือแถว ${V(u)} ช่องที่เป็น 1` : `${V(u)} ไม่มี edge ออก list จึงว่าง และแถวใน matrix เป็น 0 ทั้งหมด`, P(u));
  });
  R.snap(0, `รวมความยาวทุก list = ${total} ${G.directed ? `เท่ากับ |E| พอดี (กราฟมีทิศ)` : `เท่ากับ 2|E| เพราะ edge แบบไม่มีทิศถูกเก็บสองครั้ง`} ส่วน matrix ใช้ ${n}×${n} = ${n * n} ช่องเสมอ`, P(null));
  R.result = { total };
  return R.out();
}

/* ---------- BFS ---------- */
function runBFS(G, o) {
  const s = o.source, R = new Rec(G), c = {}, d = {}, pi = {}, Q = [];
  G.ids.forEach(v => { c[v] = 'white'; d[v] = INF; pi[v] = null; });
  const sync = () => G.ids.forEach(v => { R.n[v].c = c[v]; R.n[v].t = fmt(d[v]); });
  const P = cur => [
    queue('คิว Q (ซ้ายคือหัวคิว) พร้อมค่า d', Q.map(v => ({ v, sub: fmt(d[v]) })), 'Q ว่าง'),
    tbl('สถานะ', ['v', 'สี', 'd', 'π'], G.ids.map(v => [v, thC(c[v]), fmt(d[v]), pi[v] || 'NIL']), G.ids.indexOf(cur)),
  ];
  sync();
  R.snap([1, 2, 3, 4], 'เริ่มต้น: ทุก vertex เป็นสีขาว ยังไม่ถูกค้นพบ และ d = ∞', P());
  c[s] = 'gray'; d[s] = 0; Q.push(s); sync(); R.hi(s);
  R.snap([5, 6, 7, 8, 9], `จุดเริ่ม ${V(s)} เป็นสีเทา d = 0 แล้วเข้าคิว`, P(s));
  while (Q.length) {
    const u = Q.shift(); R.hi(u);
    R.snap(11, `DEQUEUE ได้ ${V(u)} (d = ${fmt(d[u])}) จะไล่ดูเพื่อนบ้านของมัน`, P(u));
    for (const { v } of G.adj[u]) {
      const k = ek(G, u, v);
      if (c[v] === 'white') {
        c[v] = 'gray'; d[v] = d[u] + 1; pi[v] = u; Q.push(v); R.e[k] = 'tree'; sync(); R.act(k); R.hi(u); R.hi(v, 'k');
        R.snap([13, 14, 15, 16, 17], `${V(v)} ยังขาว: ทำเป็นเทา, d = ${d[u]} + 1 = ${d[v]}, π = ${V(u)} แล้วเข้าท้ายคิว`, P(v));
      } else {
        R.act(k, 'peek'); R.hi(u); R.hi(v, 'k');
        R.snap(13, `${V(v)} เป็นสี${thC(c[v])} เจอไปแล้ว ข้าม`, P(u));
      }
    }
    c[u] = 'black'; sync(); R.hi(u);
    R.snap(18, `ไล่ Adj[${V(u)}] ครบ ${V(u)} เป็นสีดำ`, P(u));
  }
  R.snap(10, 'Q ว่าง จบ เส้นหนาคือ breadth-first tree และ d คือจำนวน edge น้อยที่สุดจากจุดเริ่ม', P());
  R.result = { d: { ...d }, pi: { ...pi } };
  return R.out();
}

/* ---------- DFS ---------- */
function runDFS(G) {
  const R = new Rec(G), c = {}, pi = {}, d = {}, f = {}, stack = [], iv = [], par = [];
  let time = 0;
  G.ids.forEach(v => { c[v] = 'white'; pi[v] = null; d[v] = f[v] = null; });
  const sync = () => G.ids.forEach(v => { R.n[v].c = c[v]; R.n[v].t = d[v] == null ? '' : d[v] + '/' + (f[v] == null ? '' : f[v]); });
  const total = 2 * G.ids.length;
  const P = cur => [
    chips(`Call stack ของ DFS-VISIT · time = ${time}`, stack.map(v => ({ t: v })), 'ยังไม่มีการเรียก'),
    { type: 'paren', title: 'Parenthesis structure', iv: iv.map(x => ({ ...x })), total, text: par.join(' ') },
    tbl('Timestamp', ['v', 'สี', 'd', 'f', 'π'], G.ids.map(v => [v, thC(c[v]), d[v] ?? '', f[v] ?? '', pi[v] || 'NIL']), G.ids.indexOf(cur)),
  ];
  sync();
  R.snap([1, 2, 3, 4], 'เริ่มต้น: ทุก vertex ขาว และ time = 0', P());
  const visit = (u, depth) => {
    time++; d[u] = time; c[u] = 'gray'; stack.push(u); par.push('(' + u); iv.push({ v: u, d: time, f: null, depth }); sync(); R.hi(u);
    R.snap([101, 102, 103], `ค้นพบ ${V(u)}: time = ${time} ดังนั้น ${V(u)}.d = ${time} เปิดวงเล็บ (${u}`, P(u));
    for (const { v } of G.adj[u]) {
      const k = ek(G, u, v);
      if (c[v] === 'white') {
        pi[v] = u; R.e[k] = 'tree'; R.el[k] = 'T'; R.act(k); R.hi(u);
        R.snap([104, 105, 106], `สำรวจ (${V(u)}, ${V(v)}): ${V(v)} ขาว จึงเป็น tree edge แล้วลงลึกไปที่ ${V(v)}`, P(v));
        visit(v, depth + 1);
      } else if (c[v] === 'gray') {
        R.e[k] = 'back'; R.el[k] = 'B'; R.act(k, 'peek'); R.hi(u);
        R.snap([104, 105], `สำรวจ (${V(u)}, ${V(v)}): ${V(v)} เทา ยังอยู่ใน call stack จึงเป็น back edge`, P(u));
      } else {
        const cls = d[u] < d[v] ? 'F' : 'C';
        R.e[k] = 'nt'; R.el[k] = cls; R.act(k, 'peek'); R.hi(u);
        R.snap([104, 105], cls === 'F'
          ? `สำรวจ (${V(u)}, ${V(v)}): ${V(v)} ดำ และ ${V(u)}.d = ${d[u]} < ${V(v)}.d = ${d[v]} จึงเป็น forward edge`
          : `สำรวจ (${V(u)}, ${V(v)}): ${V(v)} ดำ และ ${V(u)}.d = ${d[u]} > ${V(v)}.d = ${d[v]} จึงเป็น cross edge`, P(u));
      }
    }
    time++; f[u] = time; c[u] = 'black'; stack.pop(); par.push(u + ')'); iv.find(x => x.v === u).f = time; sync(); R.hi(u);
    R.snap([108, 109, 110], `Adj[${V(u)}] หมดแล้ว ${V(u)} เป็นสีดำ และ ${V(u)}.f = ${time} ปิดวงเล็บ ${u})`, P(u));
  };
  for (const u of G.order) {
    if (c[u] === 'white') {
      R.hi(u);
      R.snap([5, 6, 7], `ลูปหลักเจอ ${V(u)} ที่ยังขาว เริ่ม depth-first tree ต้นใหม่`, P(u));
      visit(u, 0);
    }
  }
  R.snap(5, 'จบ DFS เส้นหนาคือ depth-first forest ตัวอักษรบน edge คือประเภท T, B, F, C', P());
  const cls = { ...R.el };
  R.result = { d: { ...d }, f: { ...f }, cls };
  return R.out();
}

/* ---------- Topological sort ---------- */
function runTopo(G) {
  const R = new Rec(G), c = {}, d = {}, f = {}, list = [];
  let time = 0, cycle = null;
  G.ids.forEach(v => { c[v] = 'white'; d[v] = f[v] = null; });
  const sync = () => G.ids.forEach(v => { R.n[v].c = c[v]; R.n[v].t = d[v] == null ? '' : d[v] + '/' + (f[v] == null ? '' : f[v]); });
  const P = () => [
    chips('Linked list (แทรกที่หัวเสมอ)', list.map(v => ({ t: v, sub: f[v] })), 'ยังว่าง'),
    tbl('Timestamp', ['v', 'd', 'f'], G.order.map(v => [v, d[v] ?? '', f[v] ?? ''])),
  ];
  sync(); R.snap(1, 'เรียก DFS(G) เพื่อหา finishing time ของทุก vertex', P());
  const visit = u => {
    time++; d[u] = time; c[u] = 'gray'; sync(); R.hi(u);
    R.snap(1, `DFS ค้นพบ ${V(u)} ที่ time = ${time}`, P());
    for (const { v } of G.adj[u]) {
      const k = ek(G, u, v);
      if (c[v] === 'white') { R.e[k] = 'tree'; visit(v); }
      else if (c[v] === 'gray' && !cycle) { cycle = [u, v]; R.e[k] = 'rej'; }
    }
    time++; f[u] = time; c[u] = 'black'; list.unshift(u); sync(); R.hi(u);
    R.snap(2, `${V(u)} เสร็จที่ time = ${time} แทรกที่หัว list ตัวที่เสร็จทีหลังจึงอยู่หน้า`, P());
  };
  G.order.forEach(u => { if (c[u] === 'white') visit(u); });
  const lin = { type: 'linear', title: 'เรียงตาม list: ทุก edge ชี้ไปทางขวา', order: list.slice(), edges: G.E.map(e => [e.u, e.v]) };
  R.snap(3, cycle
    ? `พบ back edge (${V(cycle[0])}, ${V(cycle[1])}) กราฟนี้มีวงจร จึงไม่มี topological order ลำดับใน list ใช้ไม่ได้`
    : `คืน list: ${list.map(V).join(' → ')}`, [...P(), lin]);
  R.result = { order: list.slice(), cycle, f: { ...f } };
  return R.out();
}

/* ---------- SCC ---------- */
function runSCC(G) {
  const R = new Rec(G), c = {}, d = {}, f = {};
  let time = 0;
  G.ids.forEach(v => { c[v] = 'white'; d[v] = f[v] = null; });
  const sync = () => G.ids.forEach(v => { R.n[v].c = c[v]; R.n[v].t = d[v] == null ? '' : d[v] + '/' + (f[v] == null ? '' : f[v]); });
  const P1 = () => [tbl('DFS รอบแรกบน G', ['v', 'd', 'f'], G.ids.map(v => [v, d[v] ?? '', f[v] ?? '']))];
  sync(); R.snap(1, 'ขั้นที่ 1: DFS บน G เพื่อเก็บ finishing time', P1());
  const visit = u => {
    time++; d[u] = time; c[u] = 'gray'; sync(); R.hi(u);
    R.snap(1, `ค้นพบ ${V(u)}.d = ${time}`, P1());
    for (const { v } of G.adj[u]) if (c[v] === 'white') { R.e[ek(G, u, v)] = 'tree'; visit(v); }
    time++; f[u] = time; c[u] = 'black'; sync(); R.hi(u);
    R.snap(1, `${V(u)} เสร็จ ${V(u)}.f = ${time}`, P1());
  };
  G.order.forEach(u => { if (c[u] === 'white') visit(u); });
  const order = G.ids.slice().sort((a, b) => f[b] - f[a]);
  R.e = {}; R.flip = true;
  G.ids.forEach(v => { R.n[v].c = 'white'; R.n[v].t = 'f=' + f[v]; });
  const adjT = {}; G.ids.forEach(v => adjT[v] = []);
  G.E.forEach(e => adjT[e.v].push(e.u));
  const comps = [], seen = {};
  const P2 = () => [
    chips('ลำดับ f จากมากไปน้อย (ลูปหลักของ DFS รอบสอง)', order.map(v => ({ t: v, sub: f[v], c: seen[v] ? 'done' : '' }))),
    chips('SCC ที่พบแล้ว', comps.map((C, i) => ({ t: '{' + C.join(', ') + '}', c: 'c' + (i % 6) })), 'ยังไม่พบ'),
  ];
  R.snap(2, `ขั้นที่ 2: สร้าง G<sup>T</sup> โดยกลับทิศทุก edge ลูกศรบนภาพกลับด้านแล้ว`, P2());
  order.forEach(r => {
    if (seen[r]) return;
    const idx = comps.length, C = []; comps.push(C);
    const go = u => {
      seen[u] = true; C.push(u); R.n[u].c = 'c' + (idx % 6); R.hi(u);
      R.snap(3, `จาก ${V(u)} เดินบน G<sup>T</sup> และได้ ${V(u)} เข้ากลุ่มที่ ${idx + 1}`, P2());
      for (const v of adjT[u]) if (!seen[v]) { R.e[ek(G, v, u)] = 'tree'; go(v); }
    };
    R.hi(r);
    R.snap(3, `ขั้นที่ 3: vertex ที่ f มากสุดและยังไม่ถูกเยี่ยมคือ ${V(r)} (f = ${f[r]}) เริ่ม tree ใหม่`, P2());
    go(r);
  });
  const compOf = {}; comps.forEach((C, i) => C.forEach(v => compOf[v] = i));
  const dag = new Set();
  G.E.forEach(e => { if (compOf[e.u] !== compOf[e.v]) dag.add(comps[compOf[e.u]].join('') + ' → ' + comps[compOf[e.v]].join('')); });
  R.snap(4, `ขั้นที่ 4: แต่ละ tree คือ 1 SCC ได้ทั้งหมด ${comps.length} กลุ่ม`, [...P2(), chips('Component graph (เป็น DAG เสมอ)', [...dag].map(t => ({ t })), 'ไม่มี edge ข้ามกลุ่ม')]);
  R.result = { comps: comps.map(C => C.slice().sort()), f: { ...f } };
  return R.out();
}

/* ---------- MST: cut และ safe edge ---------- */
function runCuts(G) {
  const R = new Rec(G);
  const eKey = e => ek(G, e.u, e.v);
  const scenes = [
    { S: ['a'], A: [], msg: 'A ยังว่าง เลือกกำหนด cut S = {a} edge ที่ข้าม cut คือ a–b และ a–h ตัวเบาสุดคือ a–b (4) จึงเป็น safe edge', add: ['a', 'b'], line: 3 },
    { S: ['a', 'b'], A: [['a', 'b']], msg: 'S = {a, b} edge ข้าม cut เบาสุดมีน้ำหนัก 8 สองเส้น (a–h และ b–c) เลือกเส้นไหนก็ safe นี่คือเหตุผลที่ MST ไม่จำเป็นต้องมีแบบเดียว', tie: [['a', 'h'], ['b', 'c']], line: 3 },
    { S: ['a', 'b', 'd', 'e'], A: [['a', 'b'], ['d', 'e']], msg: 'S ไม่จำเป็นต้องต่อเนื่องกัน S = {a, b, d, e} เคารพ A เพราะไม่มี edge ของ A ข้าม cut ตัวเบาสุดคือ c–d (7) จึงเพิ่มได้อย่างปลอดภัย', add: ['c', 'd'], line: 3 },
    { S: ['g', 'h'], A: [['g', 'h']], msg: 'S = {g, h} ตัวเบาสุดคือ f–g (2) ส่วนเส้นอื่นที่ข้าม เช่น h–i (7) ไม่ใช่ light edge ของ cut นี้ ทฤษฎีจึงไม่รับประกันว่าปลอดภัย', add: ['f', 'g'], line: 3 },
  ];
  const P = sc => {
    const inS = new Set(sc.S);
    const cross = G.E.filter(e => inS.has(e.u) !== inS.has(e.v)).sort((a, b) => a.w - b.w);
    return [
      chips('S (ด้านหนึ่งของ cut)', sc.S.map(t => ({ t, c: 'c0' }))),
      tbl('Edge ที่ข้าม cut เรียงตามน้ำหนัก', ['edge', 'w'], cross.map(e => [e.u + '–' + e.v, fmt(e.w)]), 0),
    ];
  };
  R.snap([1, 2], 'A = ∅ เราจะเพิ่มทีละ edge โดยรักษาความจริงข้อเดียวว่า A เป็นส่วนหนึ่งของ MST สักต้นเสมอ', []);
  scenes.forEach(sc => {
    G.ids.forEach(v => R.n[v].c = sc.S.includes(v) ? 'c0' : 'white');
    R.e = {};
    sc.A.forEach(p => R.e[ek(G, p[0], p[1])] = 'tree');
    const inS = new Set(sc.S);
    G.E.forEach(e => { if (inS.has(e.u) !== inS.has(e.v)) R.e[eKey(e)] = 'cand'; });
    if (sc.add) R.act(ek(G, sc.add[0], sc.add[1]));
    if (sc.tie) sc.tie.forEach(p => R.act(ek(G, p[0], p[1])));
    R.snap(sc.line, sc.msg, P(sc));
  });
  return R.out();
}

/* ---------- Kruskal ---------- */
function runKruskal(G) {
  const R = new Rec(G);
  const sets = {}; G.ids.forEach(v => sets[v] = [v]);
  const sorted = G.E.slice().sort((a, b) => a.w - b.w);
  const st = sorted.map(() => 'รอ');
  let sum = 0, A = [];
  const colorSets = () => {
    const seen = []; G.ids.forEach(v => { if (sets[v].length > 1 && !seen.includes(sets[v])) seen.push(sets[v]); });
    G.ids.forEach(v => R.n[v].c = sets[v].length > 1 ? 'c' + (seen.indexOf(sets[v]) % 6) : 'white');
  };
  const P = cur => {
    const uniq = []; G.ids.forEach(v => { if (!uniq.includes(sets[v])) uniq.push(sets[v]); });
    const seen = uniq.filter(s => s.length > 1);
    return [
      chips(`Disjoint sets · w(A) = ${sum}`, uniq.map(s => ({ t: '{' + s.join(',') + '}', c: s.length > 1 ? 'c' + (seen.indexOf(s) % 6) : '' }))),
      tbl('Edge เรียงตามน้ำหนัก', ['edge', 'w', 'ผล'], sorted.map((e, i) => [e.u + '–' + e.v, fmt(e.w), st[i]]), cur),
    ];
  };
  R.snap([1, 2, 3], 'A = ∅ และ MAKE-SET ให้ทุก vertex เป็น tree ของตัวเอง', P(-1));
  R.snap(4, 'เรียง edge จากน้ำหนักน้อยไปมาก', P(-1));
  sorted.forEach((e, i) => {
    const k = ek(G, e.u, e.v);
    R.act(k); R.hi(e.u); R.hi(e.v);
    if (sets[e.u] !== sets[e.v]) {
      R.snap(6, `พิจารณา ${V(e.u)}–${V(e.v)} (w = ${fmt(e.w)}): FIND-SET ได้คนละชุด ไม่เกิดวงจร`, P(i));
      const merged = sets[e.u].concat(sets[e.v]);
      merged.forEach(v => sets[v] = merged);
      st[i] = 'เลือก'; R.e[k] = 'tree'; sum += e.w; A.push([e.u, e.v]); colorSets();
      R.snap([7, 8], `เพิ่มเข้า A แล้ว UNION สอง tree น้ำหนักรวม = ${sum}`, P(i));
    } else {
      st[i] = 'ทิ้ง'; R.e[k] = 'rej';
      R.snap(6, `พิจารณา ${V(e.u)}–${V(e.v)} (w = ${fmt(e.w)}): อยู่ชุดเดียวกันแล้ว ถ้าเพิ่มจะเกิดวงจร จึงทิ้ง`, P(i));
    }
  });
  R.snap(9, `จบ ได้ MST ${A.length} เส้น น้ำหนักรวม ${sum}`, P(-1));
  R.result = { A, sum, sorted: sorted.map(e => e.u + e.v) };
  return R.out();
}

/* ---------- Prim ---------- */
function runPrim(G, o) {
  const r = o.source, R = new Rec(G), key = {}, pi = {}, inQ = {};
  G.ids.forEach(v => { key[v] = INF; pi[v] = null; inQ[v] = true; });
  key[r] = 0;
  const order = []; let sum = 0;
  const sync = () => {
    for (const k in R.e) if (R.e[k] === 'cand') delete R.e[k];
    G.ids.forEach(v => {
      R.n[v].c = inQ[v] ? 'white' : 'black'; R.n[v].t = fmt(key[v]);
      if (inQ[v] && pi[v]) R.e[ek(G, pi[v], v)] = 'cand';
      if (!inQ[v] && pi[v]) R.e[ek(G, pi[v], v)] = 'tree';
    });
  };
  const P = cur => [
    chips(`ลำดับที่เข้า tree · w(A) = ${sum}`, order.map(v => ({ t: v })), 'ยังว่าง'),
    tbl('Min-priority queue Q (เรียงตาม key)', ['v', 'key', 'π'],
      G.ids.filter(v => inQ[v]).sort((a, b) => key[a] - key[b]).map(v => [v, fmt(key[v]), pi[v] || 'NIL']),
      G.ids.filter(v => inQ[v]).sort((a, b) => key[a] - key[b]).indexOf(cur)),
  ];
  sync();
  R.snap([1, 2, 3, 4, 5], `ทุก vertex อยู่ใน Q ด้วย key = ∞ ยกเว้น root ${V(r)} ที่ key = 0`, P(r));
  while (G.ids.some(v => inQ[v])) {
    let u = null;
    G.ids.forEach(v => { if (inQ[v] && (u === null || key[v] < key[u])) u = v; });
    inQ[u] = false; order.push(u); if (key[u] !== INF) sum += key[u]; sync(); R.hi(u);
    R.snap(7, `EXTRACT-MIN ได้ ${V(u)} (key = ${fmt(key[u])}) ${pi[u] ? `เพิ่ม edge ${V(pi[u])}–${V(u)} เข้า tree` : 'เป็น root'}`, P(u));
    for (const { v, w } of G.adj[u]) {
      const k = ek(G, u, v);
      if (inQ[v] && w < key[v]) {
        const old = key[v]; pi[v] = u; key[v] = w; sync(); R.act(k); R.hi(u); R.hi(v, 'k');
        R.snap([9, 10, 11], `${V(v)} ยังอยู่ใน Q และ w(${V(u)}, ${V(v)}) = ${fmt(w)} < key เดิม ${fmt(old)} ปรับ key = ${fmt(w)}, π = ${V(u)}`, P(v));
      } else {
        R.act(k, 'peek'); R.hi(u); R.hi(v, 'k');
        R.snap(9, inQ[v] ? `${V(v)}: w = ${fmt(w)} ไม่น้อยกว่า key เดิม ${fmt(key[v])} ไม่เปลี่ยน` : `${V(v)} อยู่ใน tree แล้ว ข้าม`, P(u));
      }
    }
  }
  R.snap(6, `Q ว่าง จบ MST มีน้ำหนักรวม ${sum}`, P());
  R.result = { order, sum, key: { ...key }, pi: { ...pi } };
  return R.out();
}

/* ---------- ใช้ร่วมกันใน SSSP ---------- */
function ssspState(G, s) {
  const d = {}, pi = {}; G.ids.forEach(v => { d[v] = INF; pi[v] = null; }); d[s] = 0; return { d, pi };
}

/* ---------- Bellman-Ford ---------- */
function runBF(G, o) {
  const s = o.source, R = new Rec(G), { d, pi } = ssspState(G, s), n = G.ids.length;
  const sync = () => { G.ids.forEach(v => { R.n[v].t = fmt(d[v]); R.n[v].c = d[v] === INF ? 'white' : 'gray'; }); setPiEdges(R, G, pi); };
  const P = (pass, cur) => [
    chips(pass === 'c' ? 'รอบตรวจวงจรลบ' : `รอบที่ ${pass} จาก ${n - 1} · ลำดับ edge ต่อรอบ`, G.edgeOrder.map((e, i) => ({ t: e.u + e.v, c: i === cur ? 'now' : '' }))),
    tbl('ค่าปัจจุบัน', ['v', 'd', 'π'], G.ids.map(v => [v, fmt(d[v]), pi[v] || 'NIL'])),
  ];
  sync();
  R.snap(1, `INITIALIZE: ${V(s)}.d = 0 ตัวอื่น ∞ จะ relax ทุก edge จำนวน |V| − 1 = ${n - 1} รอบ`, P(1, -1));
  for (let i = 1; i <= n - 1; i++) {
    let ch = 0;
    G.edgeOrder.forEach((e, idx) => {
      const k = ek(G, e.u, e.v);
      R.hi(e.u); R.hi(e.v, 'k');
      if (d[e.u] !== INF && d[e.v] > d[e.u] + e.w) {
        const old = d[e.v]; d[e.v] = d[e.u] + e.w; pi[e.v] = e.u; ch++; sync(); R.act(k);
        R.snap([3, 4], `รอบ ${i}: RELAX(${V(e.u)}, ${V(e.v)}) ${fmt(old)} > ${fmt(d[e.u])} + ${fmt(e.w)} ปรับ ${V(e.v)}.d = ${fmt(d[e.v])}`, P(i, idx));
      } else {
        R.act(k, 'peek');
        R.snap([3, 4], d[e.u] === INF ? `รอบ ${i}: ${V(e.u)}.d = ∞ ยังใช้เดินต่อไม่ได้` : `รอบ ${i}: RELAX(${V(e.u)}, ${V(e.v)}) ไม่ดีขึ้น`, P(i, idx));
      }
    });
    R.snap(2, `จบรอบ ${i} มีการปรับค่า ${ch} ครั้ง`, P(i, -1));
  }
  let ok = true, bad = null;
  for (let idx = 0; idx < G.edgeOrder.length; idx++) {
    const e = G.edgeOrder[idx], k = ek(G, e.u, e.v);
    R.hi(e.u); R.hi(e.v, 'k'); R.act(k, 'peek');
    if (d[e.u] !== INF && d[e.v] > d[e.u] + e.w) {
      ok = false; bad = e; R.act(k, 'rej');
      R.snap([6, 7], `ตรวจ (${V(e.u)}, ${V(e.v)}): ${fmt(d[e.v])} > ${fmt(d[e.u])} + ${fmt(e.w)} ยังลดได้อีก แปลว่ามีวงจรลบที่ไปถึงจาก ${V(s)} คืน FALSE`, P('c', idx));
      break;
    }
    R.snap([5, 6], `ตรวจ (${V(e.u)}, ${V(e.v)}): ลดไม่ได้แล้ว`, P('c', idx));
  }
  if (ok) R.snap(8, `ไม่มี edge ใดลดได้อีก คืน TRUE ค่า d คือระยะสั้นสุด`, P('c', -1));
  R.result = { d: { ...d }, ok, pi: { ...pi } };
  return R.out();
}

/* ---------- DAG shortest paths ---------- */
function topoQuiet(G) {
  const seen = {}, onS = {}, list = []; let cycle = null;
  const go = u => { seen[u] = onS[u] = true; G.adj[u].forEach(({ v }) => { if (onS[v]) cycle = cycle || [u, v]; else if (!seen[v]) go(v); }); onS[u] = false; list.unshift(u); };
  G.order.forEach(u => { if (!seen[u]) go(u); });
  return { list, cycle };
}
function runDAG(G, o) {
  const s = o.source, R = new Rec(G), { d, pi } = ssspState(G, s), { list, cycle } = topoQuiet(G);
  if (cycle) {
    R.snap(1, `กราฟนี้มีวงจรผ่าน ${V(cycle[0])} → ${V(cycle[1])} จึงเรียงทอพอโลยีไม่ได้ และใช้อัลกอริทึมนี้ไม่ได้ ลอง Bellman-Ford แทน`, []);
    R.result = { cycle }; return R.out();
  }
  const done = {};
  const sync = () => { G.ids.forEach(v => { R.n[v].t = fmt(d[v]); R.n[v].c = done[v] ? 'black' : 'white'; }); setPiEdges(R, G, pi); };
  const P = cur => [
    chips('ลำดับทอพอโลยี', list.map(v => ({ t: v, c: v === cur ? 'now' : done[v] ? 'done' : '' }))),
    tbl('ค่าปัจจุบัน', ['v', 'd', 'π'], list.map(v => [v, fmt(d[v]), pi[v] || 'NIL']), list.indexOf(cur)),
  ];
  sync();
  R.snap(1, `เรียงทอพอโลยีได้ ${list.map(V).join(', ')}`, P());
  R.snap(2, `INITIALIZE: ${V(s)}.d = 0 ตัวอื่น ∞`, P());
  list.forEach(u => {
    R.n[u].c = 'gray'; R.hi(u);
    R.snap(3, `หยิบ ${V(u)} ตามลำดับ (d = ${fmt(d[u])}) ตอนนี้ค่า d ของมันเป็นค่าสุดท้ายแล้ว`, P(u));
    G.adj[u].forEach(({ v, w }) => {
      const k = ek(G, u, v); R.hi(u); R.hi(v, 'k');
      if (d[u] !== INF && d[v] > d[u] + w) {
        const old = d[v]; d[v] = d[u] + w; pi[v] = u; sync(); R.n[u].c = 'gray'; R.act(k);
        R.snap([4, 5], `RELAX(${V(u)}, ${V(v)}): ${fmt(old)} > ${fmt(d[u])} + ${fmt(w)} ปรับ ${V(v)}.d = ${fmt(d[v])}`, P(u));
      } else {
        R.act(k, 'peek');
        R.snap([4, 5], d[u] === INF ? `RELAX(${V(u)}, ${V(v)}): ${V(u)}.d = ∞ เพราะอยู่ก่อนจุดเริ่ม ไม่เปลี่ยนอะไร` : `RELAX(${V(u)}, ${V(v)}): ไม่ดีขึ้น`, P(u));
      }
    });
    done[u] = true; sync();
  });
  R.snap(3, 'ครบทุก vertex ใน edge แต่ละเส้นถูก relax แค่ครั้งเดียว', [...P(), { type: 'linear', title: 'เส้นตรงตามลำดับทอพอโลยี', order: list.slice(), edges: G.E.map(e => [e.u, e.v]) }]);
  R.result = { d: { ...d }, order: list, pi: { ...pi } };
  return R.out();
}

/* ---------- Dijkstra ---------- */
function runDijkstra(G, o) {
  const s = o.source, R = new Rec(G), { d, pi } = ssspState(G, s), inQ = {}, S = [];
  G.ids.forEach(v => inQ[v] = true);
  const sync = () => { G.ids.forEach(v => { R.n[v].t = fmt(d[v]); R.n[v].c = inQ[v] ? 'white' : 'black'; }); setPiEdges(R, G, pi); };

/* RELAX อยู่ใน proc ที่สอง จึงเลื่อนเลขบรรทัดเป็น 100+ */
function shiftRelaxLines(out) {
  out.steps.forEach(s => {
    const f = x => x === 0 ? 0 : 100 + x;
    s.line = Array.isArray(s.line) ? s.line.map(f) : f(s.line);
  });
  return out;
}

const numsOf = (t, min, max) => {
  const a = t.trim().split(/[\s,]+/).filter(Boolean).map(Number);
  if (!a.length || a.some(Number.isNaN)) throw new Error('ใส่ตัวเลขคั่นด้วยช่องว่าง เช่น 5 2 4 7');
  if (a.length < min) throw new Error(`ต้องมีอย่างน้อย ${min} ตัว`);
  if (a.length > max) throw new Error(`ใส่ได้ไม่เกิน ${max} ตัว เพื่อให้ภาพยังอ่านออก`);
  return a;
};

function el(n, a = {}, p) { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
const MK = ['base', 'act', 'peek', 'tree', 'cand', 'rej', 'back', 'nt', 'pa', 'pb'];
function buildGraph() {
  const G = S.G, svg = $('#gsvg'); svg.innerHTML = ''; S.nodes = {}; S.edges = {};
  svg.setAttribute('viewBox', `-14 -8 ${G.W + 28} ${G.H + 16}`);
  const defs = el('defs', {}, svg);
  MK.forEach(c => { const m = el('marker', { id: 'mk-' + c, viewBox: '0 0 10 10', refX: 5.5, refY: 5, markerWidth: 11, markerHeight: 11, markerUnits: 'userSpaceOnUse', orient: 'auto' }, defs); el('path', { d: 'M0 0L10 5L0 10z', class: 'mk-' + c }, m); });
  const size = {};
  G.ids.forEach(id => {
    let mx = 0; S.out.steps.forEach(s => { const t = G.nameIn ? id : s.n[id].t; mx = Math.max(mx, (t || '').length); });
    const w = Math.max(40, mx * 8.6 + 18); size[id] = [w, w === 40 ? 40 : 36];
  });
  const has = (a, b) => G.E.some(e => e.u === a && e.v === b);
  const eg = el('g', {}, svg), ng = el('g', {}, svg);
  G.E.forEach(e => {
    const g = geom(G, e, size, G.directed && has(e.v, e.u));
    const key = ek(G, e.u, e.v);
    const wrap = el('g', { class: 'e' }, eg);
    const path = el('path', { d: g.d }, wrap);
    let lab = null;
    if (G.weighted && !e.opt.nl) { lab = el('text', { class: 'w', x: g.lx, y: g.ly }, wrap); lab.textContent = fmt(e.w); }
    const cl = el('text', { class: 'cl', x: g.cx, y: g.cy }, wrap);
    S.edges[key] = { wrap, path, g, cl };
  });
  G.ids.forEach(id => {
    const [x, y] = G.pos[id], [w, h] = size[id];
    const g = el('g', { class: 'n', transform: `translate(${x} ${y})` }, ng);
    el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2 }, g);
    const tin = el('text', { class: 'in', y: 0.5 }, g);
    let la = G.la[id]; if (!la) la = y < G.H / 2 ? 'a' : 'b';
    const off = { a: [0, -h / 2 - 11], b: [0, h / 2 + 12], l: [-w / 2 - 24, 0], r: [w / 2 + 24, 0], tl: [-w / 2 - 3, -h / 2 - 2] }[la];

}
function geom(G, e, size, rev) {
  const [x1, y1] = G.pos[e.u], [x2, y2] = G.pos[e.v];
  if (e.u === e.v) {
    const hw = size[e.u][0] / 2, x = x1 + hw - 3, y = y1;
    const d = `M${x} ${y - 11}C${x + 52} ${y - 42},${x + 52} ${y + 42},${x + 4} ${y + 13}`;
    return { d, dr: d, lx: x + 46, ly: y, cx: x + 40, cy: y - 18 };
  }
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  const b = e.opt.b !== undefined ? e.opt.b : (rev ? 18 : 0);
  const qx = (x1 + x2) / 2 + nx * b * 2, qy = (y1 + y2) / 2 + ny * b * 2;
  const trim = (px, py, tx, ty, s, gap) => {
    const ax = tx - px, ay = ty - py, f = 1 / Math.sqrt((ax * ax) / ((s[0] / 2) ** 2) + (ay * ay) / ((s[1] / 2) ** 2));
    const l = Math.hypot(ax, ay), g = gap / l;
    return [px + ax * (f + g), py + ay * (f + g)];
  };
  const gap = G.directed ? 6 : 0;
  const p0 = trim(x1, y1, qx, qy, size[e.u], gap ? 1 : 0), p1 = trim(x2, y2, qx, qy, size[e.v], gap);
  const pr0 = trim(x2, y2, qx, qy, size[e.v], gap ? 1 : 0), pr1 = trim(x1, y1, qx, qy, size[e.u], gap);
  const f = n => n.toFixed(1);
  const d = `M${f(p0[0])} ${f(p0[1])}Q${f(qx)} ${f(qy)} ${f(p1[0])} ${f(p1[1])}`;
  const dr = `M${f(pr0[0])} ${f(pr0[1])}Q${f(qx)} ${f(qy)} ${f(pr1[0])} ${f(pr1[1])}`;
  const t = e.opt.t !== undefined ? e.opt.t : .5, u = 1 - t;
  const lx = u * u * x1 + 2 * u * t * qx + t * t * x2, ly = u * u * y1 + 2 * u * t * qy + t * t * y2;
  return { d, dr, lx, ly, cx: lx + nx * 12, cy: ly + ny * 12 };
}

function setStep(i) {

      o.tout.textContent = G.nameIn ? st.t : (G.labels[id] !== undefined ? G.labels[id] : id.replace(/^([uv])\d$/, '$1'));
    });

    $('#vis').innerHTML = Array.isArray(s.view) ? `<div class="vgrid">${s.view.map(panelHTML).join('')}</div>` : (s.view || '');
  }

function renderPanels(s) {

  box.innerHTML = s.panels.map(panelHTML).join('') + (S.pq ? pathBox(s) : (s.query ? `<div class="pathbox">คลิกช่องใดก็ได้ในตาราง D เพื่อให้ PRINT-ALL-PAIRS-SHORTEST-PATH แสดงเส้นทางจาก Π</div>` : ''));

    if (p) for (let t = 0; t + 1 < p.length; t++) map[ek(S.G, s.ids[p[t]], s.ids[p[t + 1]])] = 'pa';

function pathBox(s) {
  const [i, j] = S.pq, ids = s.ids, p = pathOf(s.Pi, ids, i, j);
  if (!p) return `<div class="pathbox">ไม่มีเส้นทางจาก ${ids[i]} ไป ${ids[j]} ในรอบนี้</div>`;
  return `<div class="pathbox">เส้นทาง ${ids[i]} ไป ${ids[j]}: <b class="mono">${p.map(x => ids[x]).join(' → ')}</b> น้ำหนัก <b class="mono">${fmt(s.D[i][j])}</b></div>`;
}
function panelHTML(p) {
  const h = `<h3>${p.title}</h3>`;
  if (p.type === 'html') return `<div class="panel${p.wide ? ' fullw' : ''}">${h}${p.html}</div>`;
  if (p.type === 'queue') return `<div class="panel">${h}<div class="q">${p.items.length ? p.items.map(x => `<div class="cell">${esc(x.v)}<small>${x.sub}</small></div>`).join('') : `<span class="empty">${p.empty}</span>`}</div></div>`;
  if (p.type === 'chips') return `<div class="panel">${h}<div class="chips">${p.items.length ? p.items.map(x => `<span class="chip ${x.c || ''}">${esc(x.t)}${x.sub !== undefined ? `<small>${x.sub}</small>` : ''}</span>`).join('') : `<span class="empty">${p.note || ''}</span>`}</div></div>`;
  if (p.type === 'table') return `<div class="panel">${h}<div class="tw"><table class="t"><thead><tr>${p.head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${p.rows.map((r, i) => `<tr${i === p.hi ? ' class="hi"' : ''}>${r.map(x => `<td>${p.raw ? x : esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  if (p.type === 'matrix') return `<div class="panel">${h}<div class="tw"><table class="mx${p.small ? ' small' : ''}"><thead><tr><th></th>${p.ids.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${p.M.map((r, i) => `<tr><th>${esc(p.rowIds ? p.rowIds[i] : p.ids[i])}</th>${r.map((x, j) => `<td class="${p.cells[i + ',' + j] || ''}${p.click ? ' click' : ''}" data-i="${i}" data-j="${j}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  if (p.type === 'adjlist') return `<div class="panel">${h}<div class="alist">${p.rows.map(r => `<div class="${r.hi ? 'hi' : ''}"><b>${esc(r.v)}</b>→ ${r.list.length ? r.list.map(esc).join(' → ') : '/'}</div>`).join('')}</div></div>`;
  if (p.type === 'paren') {
    const W = 330, step = (W - 8) / p.total, rh = 18, depth = Math.max(0, ...p.iv.map(x => x.depth)) + 1, H = Math.max(depth, 2) * rh + 18;
    let s = `<svg class="pbar" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="ช่วงเวลาของแต่ละ vertex">`;
    p.iv.forEach(x => { const a = 4 + (x.d - 1) * step, b = 4 + ((x.f || p.total) - 1) * step + step, y = x.depth * rh + 1; s += `<rect class="${x.f ? '' : 'open'}" x="${a}" y="${y}" width="${b - a}" height="${rh - 3}" rx="2"/><text x="${(a + b) / 2}" y="${y + (rh - 3) / 2}">${esc(x.v)}</text>`; });
    for (let t = 1; t <= p.total; t++) s += `<text class="tick" x="${4 + (t - .5) * step}" y="${H - 5}">${t}</text>`;
    return `<div class="panel">${h}${s}</svg><div class="parent tw">${esc(p.text) || '&nbsp;'}</div></div>`;
  }
  if (p.type === 'linear') {
    let x = 6; const X = {}, Wd = {};
    p.order.forEach(v => { const w = Math.max(26, v.length * 7.4 + 12); X[v] = x + w / 2; Wd[v] = w; x += w + 12; });
    const y = 84;
    const arcs = p.edges.map(([a, b]) => { const h = Math.min(66, 14 + Math.abs(X[b] - X[a]) * .16), mx = (X[a] + X[b]) / 2; return `<path d="M${X[a]} ${y - 11}Q${mx} ${y - 11 - h * 2} ${X[b]} ${y - 12}" marker-end="url(#mk-tree)"/>`; }).join('');
    const nodes = p.order.map(v => `<rect x="${X[v] - Wd[v] / 2}" y="${y - 11}" width="${Wd[v]}" height="22" rx="11"/><text x="${X[v]}" y="${y}">${esc(v)}</text>`).join('');
    return `<div class="panel" style="grid-column:1/-1">${h}<div class="tw"><svg class="lin" viewBox="0 0 ${x} 104" style="min-width:${Math.min(x, 460)}px;width:100%;height:auto" role="img" aria-label="${esc(p.title)}">${arcs}${nodes}</svg></div></div>`;
  }
  return '';
}

function play() {
  if (S.i >= S.out.steps.length - 1) setStep(0);
  $('#play').textContent = 'หยุด';
  S.timer = setInterval(() => { if (S.i >= S.out.steps.length - 1) { stop(); return; } setStep(S.i + 1); }, S.speed);
}
function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; } const b = $('#play'); if (b) b.textContent = 'เล่น'; }

function route() {
  const id = (location.hash || '').slice(1);
  const L = ALL_LESSONS.find(x => x.id === id);
  if (L) renderLesson(L); else renderHome();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  e.preventDefault();
  const id = b.dataset.go;
  if ((location.hash || '').slice(1) === id) route(); else location.hash = id;
});
document.addEventListener('keydown', e => {
  const t = e.target, tag = t.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
  if (e.target.matches && e.target.matches('.node') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); location.hash = e.target.dataset.go; return; }
  if (!S.L) return;
  if (e.key === 'ArrowRight') { stop(); setStep(S.i + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { stop(); setStep(S.i - 1); e.preventDefault(); }
  else if (e.key === ' ' && tag !== 'BUTTON') { S.timer ? stop() : play(); e.preventDefault(); }
});
window.addEventListener('hashchange', route);
nav(); route();
</script></body></html>
